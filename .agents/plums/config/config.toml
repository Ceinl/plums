default_layout = "split"
hide_thinking = false
# Hide pre-existing backend sessions; only sessions created in this run are shown.
clear_history = false

# Backend provider: "opencode" or "codex".
[backend]
provider = "opencode"

# Opencode server URL. When omitted, plums picks a port automatically from
# your project directory so different worktrees don't collide.
# [opencode]
# opencode_server_url = "http://127.0.0.1:4096"

[split]
left_width = 40

[harnesses]
opencode_server = "*"
